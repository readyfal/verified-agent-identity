name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Install Verified Agent Identity
        run: clawhub install verified-agent-identity

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |{"verifierDid":"did:iden3:billions:main:2VmnvBNtpxCUbiEH3R2DNuXqPxuaBQJsG6mwU1J8PD","userProfileDid":"did:iden3:billions:main:2VvF2LaqL3zWgCT5HC2jX9dSTWVxvo6dcCwTt3vaWH","trusted":false,"tags":[]}
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"readyfal","description":"readyfal AI Agent"}' 
